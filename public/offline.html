<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDSC — Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#020810;color:#e8f1ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;margin-bottom:20px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 24px;color:#9db4d6;max-width:320px;line-height:1.5}
  button{background:#22d3ee;color:#020810;border:0;border-radius:999px;padding:12px 28px;font-size:1rem;font-weight:600}
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="NDSC logo">
    <h1>You're offline</h1>
    <p>NDSC needs an internet connection. Please check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
